<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PENTAGRAM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#111;color:#fff}
header{position:sticky;top:0;background:#151515;padding:14px 20px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-size:28px;font-weight:700;background:linear-gradient(90deg,#ff00cc,#00d4ff);-webkit-background-clip:text;color:transparent}
nav button{margin:0 6px;padding:10px 14px;border:none;border-radius:12px;background:#222;color:#fff;cursor:pointer}
nav button:hover{background:#333}
.page{display:none;padding:20px;max-width:1100px;margin:auto}
.active{display:block}
.card{background:#1b1b1b;border-radius:16px;padding:16px;margin:16px 0;border:1px solid #333}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:none;background:#222;color:#fff}
button.action{background:#ff00cc;color:#fff;padding:10px 14px;border:none;border-radius:12px;cursor:pointer}
img,video{max-width:100%;border-radius:14px;margin-top:10px}
#stories{display:flex;gap:10px;overflow:auto;margin-bottom:20px}
.story{min-width:80px;height:80px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;border:3px solid #ff00cc}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid img,.grid video{height:180px;object-fit:cover;width:100%}
.chatbox{height:260px;overflow:auto;background:#0f0f0f;padding:10px;border-radius:12px;margin-bottom:10px}
.message{padding:8px;background:#222;border-radius:10px;margin:6px 0}
.profile-top{display:flex;gap:20px;align-items:center}
.avatar{width:90px;height:90px;border-radius:50%;background:#333;object-fit:cover}
.stats{display:flex;gap:20px;margin-top:10px}
</style>
</head>
<body>
<header>
<div class="logo">PENTAGRAM</div>
<nav>
<button onclick="showPage('home')">Inicio</button>
<button onclick="showPage('explore')">Explorar</button>
<button onclick="showPage('reels')">Reels</button>
<button onclick="showPage('chat')">Chat</button>
<button onclick="showPage('profile')">Perfil</button>
</nav>
</header>

<section id="home" class="page active">
<div id="stories"></div>
<div class="card">
<h3>Crear publicación</h3>
<textarea id="postText" placeholder="¿Qué estás pensando?"></textarea>
<input type="file" id="postMedia" accept="image/*,video/*">
<button class="action" onclick="createPost()">Publicar</button>
</div>
<div id="feed"></div>
</section>

<section id="explore" class="page">
<h2>Explorar</h2>
<div id="exploreFeed"></div>
</section>

<section id="reels" class="page">
<h2>Reels</h2>
<div id="reelsFeed"></div>
</section>

<section id="chat" class="page">
<div class="card">
<h2>Mensajes</h2>
<div class="chatbox" id="chatMessages"></div>
<input id="chatInput" placeholder="Escribe un mensaje...">
<button class="action" onclick="sendMessage()">Enviar</button>
</div>
</section>

<section id="profile" class="page">
<div class="card">
<div class="profile-top">
<img id="avatarPreview" class="avatar">
<div>
<input id="profileName" placeholder="Nombre">
<textarea id="profileBio" placeholder="Bio"></textarea>
<input type="file" id="avatarInput" accept="image/*">
<button class="action" onclick="saveProfile()">Guardar perfil</button>
<div class="stats">
<div><b id="countPosts">0</b><br>posts</div>
<div><b>120</b><br>seguidores</div>
<div><b>89</b><br>siguiendo</div>
</div>
</div>
</div>
</div>
<div class="grid" id="profileGrid"></div>
</section>

<script>
let posts=JSON.parse(localStorage.getItem('pentagram_posts')||'[]');
let messages=JSON.parse(localStorage.getItem('pentagram_chat')||'[]');
let profile=JSON.parse(localStorage.getItem('pentagram_profile')||'{"name":"Usuario","bio":"","avatar":""}');

function saveAll(){
localStorage.setItem('pentagram_posts',JSON.stringify(posts));
localStorage.setItem('pentagram_chat',JSON.stringify(messages));
localStorage.setItem('pentagram_profile',JSON.stringify(profile));
}

function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
render();
}

function createPost(){
const text=document.getElementById('postText').value;
const file=document.getElementById('postMedia').files[0];
if(!text && !file)return;
if(file){
const r=new FileReader();
r.onload=()=>{
posts.unshift({text,media:r.result,type:file.type,likes:0,comments:[]});
saveAll();render();
};
r.readAsDataURL(file);
}else{
posts.unshift({text,media:'',type:'',likes:0,comments:[]});
saveAll();render();
}
}

function likePost(i){posts[i].likes++;saveAll();render();}
function deletePost(i){posts.splice(i,1);saveAll();render();}
function addComment(i){
const c=prompt('Comentario');
if(c){posts[i].comments.push(c);saveAll();render();}
}

function sendMessage(){
const t=document.getElementById('chatInput').value;
if(!t)return;
messages.push(t);
document.getElementById('chatInput').value='';
saveAll();render();
}

document.getElementById('avatarInput').addEventListener('change',e=>{
const f=e.target.files[0];
if(!f)return;
const r=new FileReader();
r.onload=()=>{profile.avatar=r.result;document.getElementById('avatarPreview').src=r.result;saveAll();};
r.readAsDataURL(f);
});

function saveProfile(){
profile.name=document.getElementById('profileName').value;
profile.bio=document.getElementById('profileBio').value;
saveAll();render();
}

function render(){
const feed=document.getElementById('feed');
const explore=document.getElementById('exploreFeed');
const reels=document.getElementById('reelsFeed');
const grid=document.getElementById('profileGrid');
feed.innerHTML='';explore.innerHTML='';reels.innerHTML='';grid.innerHTML='';
posts.forEach((p,i)=>{
let media='';
if(p.media){
media=p.type.startsWith('video')?`<video controls src="${p.media}"></video>`:`<img src="${p.media}">`;
}
const card=`<div class='card'><b>${profile.name}</b><p>${p.text}</p>${media}<br><button class='action' onclick='likePost(${i})'>❤ ${p.likes}</button> <button class='action' onclick='addComment(${i})'>💬 ${p.comments.length}</button> <button class='action' onclick='deletePost(${i})'>🗑</button><div>${p.comments.map(c=>`<div class='message'>${c}</div>`).join('')}</div></div>`;
feed.innerHTML+=card;
explore.innerHTML+=card;
if(p.type.startsWith('video'))reels.innerHTML+=card;
if(p.media)grid.innerHTML+=p.type.startsWith('video')?`<video controls src='${p.media}'></video>`:`<img src='${p.media}'>`;
});
document.getElementById('chatMessages').innerHTML=messages.map(m=>`<div class='message'>${m}</div>`).join('');
document.getElementById('profileName').value=profile.name;
document.getElementById('profileBio').value=profile.bio;
document.getElementById('avatarPreview').src=profile.avatar||'';
document.getElementById('countPosts').textContent=posts.length;
document.getElementById('stories').innerHTML=`<div class='story'>+</div><div class='story'>Ana</div><div class='story'>Luis</div><div class='story'>Mia</div>`;
}
render();
</script>
</body>
</html>
