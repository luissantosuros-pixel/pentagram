<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PENTAGRAM</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
position:fixed;
top:0;
left:0;
right:0;
height:65px;
background:#181818;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #333;
z-index:10;
}

.logo{
font-size:32px;
font-weight:bold;
color:#d04fff;
}

.container{
max-width:700px;
margin:auto;
padding:90px 15px 90px;
}

.card{
background:#1a1a1a;
border-radius:15px;
padding:18px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.card-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.username{
font-weight:bold;
font-size:18px;
}

.follow-btn{
background:#d04fff;
color:white;
border:none;
padding:8px 14px;
border-radius:10px;
cursor:pointer;
}

textarea{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#2a2a2a;
color:white;
resize:none;
margin-bottom:12px;
}

button{
cursor:pointer;
}

.post-btn{
width:100%;
padding:12px;
background:#d04fff;
border:none;
color:white;
border-radius:12px;
font-size:16px;
}

.actions{
display:flex;
gap:20px;
margin-top:15px;
font-size:22px;
cursor:pointer;
}

.comments{
margin-top:15px;
}

.comment{
background:#222;
padding:10px;
border-radius:10px;
margin-top:8px;
}

.comment-input{
margin-top:12px;
display:flex;
gap:10px;
}

.comment-input input{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:#2a2a2a;
color:white;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
background:#181818;
display:flex;
justify-content:space-around;
align-items:center;
font-size:28px;
border-top:1px solid #333;
}

.stats{
display:flex;
gap:20px;
margin-top:8px;
color:#bbb;
font-size:14px;
}

</style>
</head>

<body>

<header>
<div class="logo">PENTAGRAM</div>
<div>🔔</div>
</header>

<div class="container">

<div class="card">
<h2>Tu perfil</h2>
<div class="stats">
<div>Seguidores: <span id="followers">0</span></div>
<div>Siguiendo: <span id="following">0</span></div>
</div>
</div>

<div class="card">
<textarea id="postText" rows="4" placeholder="¿Qué quieres compartir?"></textarea>
<button class="post-btn" onclick="createPost()">Publicar</button>
</div>

<div id="feed"></div>

</div>

<div class="bottom-nav">
<div>🏠</div>
<div onclick="scrollTo(0,0)">➕</div>
<div>👤</div>
</div>

<script>

let followers=0;
let following=0;

let posts=JSON.parse(localStorage.getItem("posts"))||[
{
user:"Pentagram",
text:"Bienvenido a Pentagram 🚀",
likes:0,
comments:[]
}
];

function save(){
localStorage.setItem("posts",JSON.stringify(posts));
}

function render(){

document.getElementById("followers").textContent=followers;
document.getElementById("following").textContent=following;

const feed=document.getElementById("feed");

feed.innerHTML="";

posts.slice().reverse().forEach((post,index)=>{

const realIndex=posts.length-1-index;

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="card-header">
<div class="username">${post.user}</div>
<button class="follow-btn"
onclick="followUser()">
Seguir
</button>
</div>

<div>${post.text}</div>

<div class="actions">
<span onclick="likePost(${realIndex})">❤️ ${post.likes}</span>
<span>💬 ${post.comments.length}</span>
</div>

<div class="comments" id="comments-${realIndex}">
${post.comments.map(c=>`
<div class="comment">${c}</div>
`).join("")}
</div>

<div class="comment-input">
<input id="input-${realIndex}" placeholder="Escribe comentario">
<button class="follow-btn"
onclick="addComment(${realIndex})">
Enviar
</button>
</div>
`;

feed.appendChild(card);

});
}

function createPost(){

const text=document.getElementById("postText").value.trim();

if(!text)return;

posts.push({
user:"Tú",
text,
likes:0,
comments:[]
});

document.getElementById("postText").value="";

save();
render();
}

function likePost(i){
posts[i].likes++;
save();
render();
}

function addComment(i){

const input=document.getElementById(`input-${i}`);

if(!input.value.trim())return;

posts[i].comments.push(input.value);

input.value="";

save();
render();
}

function followUser(){
followers++;
following++;
render();
}

render();

</script>

</body>
</html>
