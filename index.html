<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PENTAGRAM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ececec;
}

header{
background:white;
padding:18px;
font-size:28px;
font-weight:bold;
color:#c13787;
border-bottom:1px solid #ddd;
}

.container{
padding:20px;
padding-bottom:90px;
}

.stats{
margin-bottom:20px;
}

.stats div{
margin-top:8px;
font-size:20px;
}

.card{
background:white;
padding:16px;
margin-bottom:20px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ccc;
resize:none;
font-size:16px;
}

button{
border:none;
cursor:pointer;
}

.post-btn{
margin-top:12px;
width:100%;
padding:12px;
background:#c13787;
color:white;
border-radius:12px;
font-size:16px;
}

.actions{
display:flex;
gap:20px;
margin-top:15px;
font-size:20px;
}

.comment-box{
display:flex;
gap:8px;
margin-top:12px;
}

.comment-box input{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
}

.comment{
margin-top:8px;
background:#f5f5f5;
padding:10px;
border-radius:10px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:58px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
font-size:28px;
border-top:1px solid #ddd;
}

.nav-btn{
cursor:pointer;
}

.hidden{
display:none;
}

.profile{
font-size:18px;
}

</style>
</head>

<body>

<header>PENTAGRAM</header>

<div class="container">

<div id="home">

<div class="stats">
<div>Seguidores: <span id="followers">0</span></div>
<div>Siguiendo: <span id="following">0</span></div>
</div>

<div id="feed"></div>

</div>

<div id="create" class="hidden">

<div class="card">

<textarea
id="postText"
rows="5"
placeholder="¿Qué quieres compartir?">
</textarea>

<button
class="post-btn"
onclick="createPost()">
Publicar
</button>

</div>

</div>

<div id="profile" class="hidden">

<div class="card profile">
<h2>Tu perfil</h2>
<br>
Publicaciones:
<span id="totalPosts">0</span>
</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav-btn" onclick="showPage('home')">🏠</div>

<div class="nav-btn" onclick="showPage('create')">➕</div>

<div class="nav-btn" onclick="showPage('profile')">👤</div>

</div>

<script>

let followers=
Number(localStorage.getItem("followers"))||0;

let following=
Number(localStorage.getItem("following"))||0;

let posts=
JSON.parse(localStorage.getItem("posts"))||[];

function save(){

localStorage.setItem(
"posts",
JSON.stringify(posts)
);

localStorage.setItem(
"followers",
followers
);

localStorage.setItem(
"following",
following
);

}

function showPage(page){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("create")
.classList.add("hidden");

document
.getElementById("profile")
.classList.add("hidden");

document
.getElementById(page)
.classList.remove("hidden");

render();

}

function createPost(){

const text=
document
.getElementById("postText")
.value
.trim();

if(!text)return;

posts.push({
user:"Tú",
text:text,
likes:0,
comments:[]
});

document
.getElementById("postText")
.value="";

save();

showPage("home");

}

function likePost(i){

posts[i].likes++;

save();

render();

}

function addComment(i){

const input=
document.getElementById(
"comment-"+i
);

const value=
input.value.trim();

if(!value)return;

posts[i]
.comments
.push(value);

input.value="";

save();

render();

}

function followUser(){

followers++;

following++;

save();

render();

}

function render(){

document
.getElementById("followers")
.textContent=followers;

document
.getElementById("following")
.textContent=following;

document
.getElementById("totalPosts")
.textContent=posts.length;

const feed=
document.getElementById("feed");

feed.innerHTML="";

posts
.slice()
.reverse()
.forEach((post,index)=>{

const real=
posts.length-1-index;

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<strong>${post.user}</strong>

<div style="margin-top:10px">
${post.text}
</div>

<div class="actions">

<div onclick="likePost(${real})">
❤️ ${post.likes}
</div>

<div>
💬 ${post.comments.length}
</div>

<div onclick="followUser()">
➕ seguir
</div>

</div>

<div>

${post.comments.map(c=>`

<div class="comment">
${c}
</div>

`).join("")}

</div>

<div class="comment-box">

<input
id="comment-${real}"
placeholder="Comentar">

<button
class="post-btn"
style="width:auto;padding:10px"
onclick="addComment(${real})">

Enviar

</button>

</div>

`;

feed.appendChild(card);

});

}

render();

</script>

</body>
</html>
