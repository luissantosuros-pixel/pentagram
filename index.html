<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PENTAGRAM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f8;
color:#222;
}

header{
height:70px;
background:white;
display:flex;
align-items:center;
padding:0 20px;
font-size:22px;
font-weight:bold;
color:#c13787;
border-bottom:1px solid #eee;
position:fixed;
top:0;
left:0;
right:0;
z-index:10;
}

.container{
max-width:650px;
margin:auto;
padding:90px 14px 90px;
}

.stats{
display:flex;
gap:18px;
margin-bottom:20px;
}

.stat{
background:white;
padding:14px;
border-radius:16px;
flex:1;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.card{
background:white;
border-radius:18px;
padding:16px;
margin-bottom:18px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.username{
font-weight:bold;
margin-bottom:10px;
color:#c13787;
}

.post-text{
font-size:16px;
line-height:1.4;
}

.actions{
display:flex;
gap:20px;
margin-top:14px;
font-size:18px;
}

.action{
cursor:pointer;
}

textarea{
width:100%;
border:none;
background:#f3f3f3;
padding:14px;
border-radius:14px;
font-size:16px;
resize:none;
}

.post-btn{
margin-top:12px;
width:100%;
padding:14px;
border:none;
background:#c13787;
color:white;
border-radius:14px;
font-size:16px;
cursor:pointer;
}

.comment-box{
display:flex;
gap:8px;
margin-top:12px;
}

.comment-box input{
flex:1;
padding:10px;
border-radius:12px;
border:none;
background:#f3f3f3;
}

.send{
padding:10px 14px;
background:#c13787;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

.comment{
margin-top:8px;
background:#fafafa;
padding:10px;
border-radius:12px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:64px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
font-size:26px;
border-top:1px solid #eee;
}

.nav{
cursor:pointer;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<header>PENTAGRAM</header>

<div class="container">

<div id="home">

<div class="stats">
<div class="stat">
Seguidores<br>
<b id="followers">0</b>
</div>

<div class="stat">
Siguiendo<br>
<b id="following">0</b>
</div>
</div>

<div id="feed"></div>

</div>

<div id="create" class="hidden">

<div class="card">

<textarea
id="postText"
rows="5"
placeholder="¿Qué estás pensando?">
</textarea>

<button
class="post-btn"
onclick="createPost()">
Publicar
</button>

</div>

</div>

<div id="profile" class="hidden">

<div class="card">
<h2>Tu perfil</h2>
<br>
Publicaciones:
<b id="postCount">0</b>
</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav"
onclick="showPage('home')">
🏠
</div>

<div class="nav"
onclick="showPage('create')">
➕
</div>

<div class="nav"
onclick="showPage('profile')">
👤
</div>

</div>

<script>

let followers=
Number(localStorage.getItem("followers"))||0;

let following=
Number(localStorage.getItem("following"))||0;

let posts=
JSON.parse(localStorage.getItem("posts"))||[];

function save(){

localStorage.setItem(
"followers",
followers
);

localStorage.setItem(
"following",
following
);

localStorage.setItem(
"posts",
JSON.stringify(posts)
);

}

function showPage(page){

["home","create","profile"]
.forEach(id=>{

document
.getElementById(id)
.classList
.add("hidden");

});

document
.getElementById(page)
.classList
.remove("hidden");

render();

}

function createPost(){

const text=
document
.getElementById("postText")
.value
.trim();

if(!text)return;

posts.push({
user:"Tú",
text:text,
likes:0,
comments:[]
});

document
.getElementById("postText")
.value="";

save();

showPage("home");

}

function likePost(i){

posts[i].likes++;

save();

render();

}

function followUser(){

followers++;
following++;

save();

render();

}

function addComment(i){

const input=
document.getElementById(
"comment-"+i
);

const value=
input.value.trim();

if(!value)return;

posts[i]
.comments
.push(value);

input.value="";

save();

render();

}

function render(){

document
.getElementById("followers")
.textContent=followers;

document
.getElementById("following")
.textContent=following;

document
.getElementById("postCount")
.textContent=posts.length;

const feed=
document.getElementById("feed");

feed.innerHTML="";

posts
.slice()
.reverse()
.forEach((post,index)=>{

const real=
posts.length-1-index;

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="username">
${post.user}
</div>

<div class="post-text">
${post.text}
</div>

<div class="actions">

<div class="action"
onclick="likePost(${real})">
❤️ ${post.likes}
</div>

<div class="action"
onclick="followUser()">
➕ seguir
</div>

</div>

${post.comments.map(c=>`

<div class="comment">
${c}
</div>

`).join("")}

<div class="comment-box">

<input
id="comment-${real}"
placeholder="Comentar...">

<button
class="send"
onclick="addComment(${real})">

Enviar

</button>

</div>

`;

feed.appendChild(card);

});

}

render();

</script>

</body>
</html>
