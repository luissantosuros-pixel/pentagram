<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PENTAGRAM</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f8;
color:#222;
}

header{
position:fixed;
top:0;
left:0;
right:0;
height:70px;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;
border-bottom:1px solid #eee;
z-index:100;
}

.logo{
font-size:24px;
font-weight:bold;
color:#c13787;
}

.container{
max-width:700px;
margin:auto;
padding:90px 14px 90px;
}

.hidden{
display:none;
}

.stories{
display:flex;
gap:12px;
overflow:auto;
margin-bottom:18px;
}

.story{
min-width:72px;
background:white;
border-radius:18px;
padding:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.05);
cursor:pointer;
}

.card{
background:white;
padding:16px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.username{
font-weight:bold;
color:#c13787;
margin-bottom:8px;
}

.date{
font-size:12px;
color:#777;
margin-bottom:10px;
}

.actions{
display:flex;
gap:14px;
margin-top:12px;
flex-wrap:wrap;
}

.action{
cursor:pointer;
}

textarea,input{
width:100%;
padding:12px;
border:none;
border-radius:14px;
background:#f3f3f3;
margin-bottom:12px;
}

button{
border:none;
cursor:pointer;
}

.main-btn{
width:100%;
padding:14px;
background:#c13787;
color:white;
border-radius:14px;
}

.comment{
margin-top:8px;
padding:10px;
background:#fafafa;
border-radius:12px;
}

.profile-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:18px;
}

.grid-item{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:64px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
font-size:24px;
border-top:1px solid #eee;
}

.nav{
cursor:pointer;
}
</style>
</head>
<body>

<header>
<div class="logo">PENTAGRAM</div>
<div>🔔 <span id="notify">0</span></div>
</header>

<div class="container">

<!-- HOME -->
<div id="home">

<div class="stories">

<div class="story">➕<br>Tú</div>
<div class="story">🌸<br>Ana</div>
<div class="story">🔥<br>Luis</div>
<div class="story">🎵<br>Sara</div>

</div>

<input
id="search"
placeholder="Buscar..."
onkeyup="render()">

<div id="feed"></div>

</div>

<!-- EXPLORE -->
<div id="explore" class="hidden">

<div class="card">
<h2>Explorar 🔍</h2>
<br>
Descubre publicaciones nuevas.
</div>

<div id="exploreFeed"></div>

</div>

<!-- REELS -->
<div id="reels" class="hidden">

<div class="card">
<h2>Reels 🎬</h2>
</div>

<div id="reelsFeed"></div>

</div>

<!-- CREATE -->
<div id="create" class="hidden">

<div class="card">

<textarea
id="postText"
rows="5"
placeholder="¿Qué quieres compartir?">
</textarea>

<button
class="main-btn"
onclick="createPost()">

Publicar

</button>

</div>

</div>

<!-- PROFILE -->
<div id="profile" class="hidden">

<div class="card">

<h2 id="profileName"></h2>

<br>

<button
class="main-btn"
onclick="editProfile()">

Editar perfil

</button>

<br><br>

Publicaciones:
<b id="postCount">0</b>

<br><br>

Likes:
<b id="totalLikes">0</b>

</div>

<div
class="profile-grid"
id="profileGrid">
</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav"
onclick="showPage('home')">
🏠
</div>

<div class="nav"
onclick="showPage('explore')">
🔍
</div>

<div class="nav"
onclick="showPage('reels')">
🎬
</div>

<div class="nav"
onclick="showPage('create')">
➕
</div>

<div class="nav"
onclick="showPage('profile')">
👤
</div>

</div>

<script>

let username=
localStorage.getItem("username")
||"Tú";

let notifications=
Number(localStorage.getItem("notifications"))
||0;

let posts=
JSON.parse(localStorage.getItem("posts"))
||[];

function save(){

localStorage.setItem(
"username",
username
);

localStorage.setItem(
"notifications",
notifications
);

localStorage.setItem(
"posts",
JSON.stringify(posts)
);

}

function showPage(page){

[
"home",
"explore",
"reels",
"create",
"profile"
]
.forEach(id=>{

document
.getElementById(id)
.classList
.add("hidden");

});

document
.getElementById(page)
.classList
.remove("hidden");

render();

}

function createPost(){

const text=
document
.getElementById("postText")
.value
.trim();

if(!text)return;

posts.push({

user:username,

text:text,

likes:0,

comments:[],

date:new Date()
.toLocaleString()

});

document
.getElementById("postText")
.value="";

save();

showPage("home");

}

function likePost(i){

posts[i].likes++;

save();

render();

}

function addComment(i){

const input=
document.getElementById(
"comment-"+i
);

const value=
input.value.trim();

if(!value)return;

posts[i]
.comments
.push(value);

notifications++;

save();

render();

}

function deletePost(i){

if(confirm("Eliminar?")){

posts.splice(i,1);

save();

render();

}

}

function editPost(i){

const n=
prompt(
"Editar publicación:",
posts[i].text
);

if(!n)return;

posts[i].text=n;

save();

render();

}

function editProfile(){

const n=
prompt(
"Tu nombre:",
username
);

if(!n)return;

username=n;

save();

render();

}

function renderCard(post,i){

return `

<div class="card">

<div class="username">
${post.user}
</div>

<div class="date">
${post.date}
</div>

<div>
${post.text}
</div>

<div class="actions">

<div class="action"
onclick="likePost(${i})">
❤️ ${post.likes}
</div>

<div class="action"
onclick="editPost(${i})">
✏️
</div>

<div class="action"
onclick="deletePost(${i})">
🗑️
</div>

</div>

${post.comments.map(c=>`

<div class="comment">
${c}
</div>

`).join("")}

<input
id="comment-${i}"
placeholder="Comentar...">

<button
class="main-btn"
onclick="addComment(${i})">

Enviar

</button>

</div>

`;

}

function render(){

document
.getElementById("notify")
.textContent=
notifications;

document
.getElementById("profileName")
.textContent=
username;

document
.getElementById("postCount")
.textContent=
posts.length;

let likes=0;

posts.forEach(p=>likes+=p.likes);

document
.getElementById("totalLikes")
.textContent=
likes;

const search=
document
.getElementById("search")
.value
.toLowerCase();

document
.getElementById("feed")
.innerHTML=
posts
.slice()
.reverse()
.filter(p=>
p.text
.toLowerCase()
.includes(search)
)
.map((p,index)=>
renderCard(
p,
posts.length-1-index
)
)
.join("");

document
.getElementById("exploreFeed")
.innerHTML=
posts
.slice()
.reverse()
.map((p,index)=>
renderCard(
p,
posts.length-1-index
)
)
.join("");

document
.getElementById("reelsFeed")
.innerHTML=
posts
.slice()
.reverse()
.map((p,index)=>
renderCard(
p,
posts.length-1-index
)
)
.join("");

document
.getElementById("profileGrid")
.innerHTML=
posts
.slice()
.reverse()
.map(p=>`

<div class="grid-item">

${p.text.slice(0,40)}

</div>

`)
.join("");

}

render();

</script>

</body>
</html>
